name: NFS cluster

on:
  # Pull requests run on their own; pushing to one shouldn't run it twice.
  push:
    branches: [lex]
  pull_request:
  workflow_dispatch:

jobs:
  nfs-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # enable_kvm opens the runner's /dev/kvm, normally only for root and
      # the kvm group, to Nix's build users. kvm and nixos-test are features
      # the test derivation requires, so Nix won't start it without them.
      # relaxed lets it set __noChroot to reach the servers on the host.
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            sandbox = relaxed

      - name: Check that Nix's build users get KVM
        run: |
          ls -l /dev/kvm
          [[ $(stat -c %a /dev/kvm) == 666 ]]
          nix config show system-features | tee /dev/stderr | grep -qw kvm

      - name: Start the NFS server and metadata service on the host
        run: test/ci-host.sh start

      - name: Run the NixOS test
        run: nix build -L --no-link .#legacyPackages.x86_64-linux.nfs-cluster-test

      - name: Check the host's view of the store
        run: test/ci-host.sh verify

      - name: Host logs
        if: always()
        run: test/ci-host.sh logs

      - name: NFS trace
        if: always()
        run: test/ci-host.sh nfs-trace

      # Open nfs.pcap in Wireshark; nfsd-states.log says which connection is
      # which client.
      - name: Upload the NFS capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfs-trace
          path: |
            /tmp/nixremote-host/nfs.pcap
            /tmp/nixremote-host/*.log
