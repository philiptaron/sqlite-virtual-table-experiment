name: NFS cluster

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  nfs-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The runner has /dev/kvm, but only for root and the kvm group; Nix's
      # build users need it too.
      - name: Open /dev/kvm to every user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # kvm and nixos-test are features the test derivation requires, so Nix
      # won't start it without them. relaxed lets it set __noChroot to reach
      # the servers on the host.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            sandbox = relaxed

      - name: Check that Nix offers builds the kvm feature
        run: nix config show system-features | tee /dev/stderr | grep -qw kvm

      - name: Start the NFS server and metadata service on the host
        run: test/ci-host.sh start

      - name: Run the NixOS test
        run: nix build -L --no-link .#legacyPackages.x86_64-linux.nfs-cluster-test

      - name: Check the host's view of the store
        run: test/ci-host.sh verify

      - name: Metadata service log
        if: always()
        run: test/ci-host.sh logs | tail -n 200
